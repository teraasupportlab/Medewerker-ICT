r om voorzichtig de buitenste isolatie te verwijderen.","Zorg ervoor dat de koperen draden niet beschadigd raken."],"menuLabel":"Snoer voorbereiden"},{"label":"Stap 3","title":"Stap 3: Kijk goed naar de stekker","items":["Bestudeer de stekker en herken de verschillende onderdelen, zoals de pinnen, schroeven en klemmen.","Begrijp hoe de stekker werkt voordat je begint met aansluiten."],"menuLabel":"Stekker bekijken"},{"label":"Stap 4","title":"Stap 4: Draden aansluiten","items":["Zoek de juiste draden in het snoer:","Bruin = fase (stroomdraad)","Blauw = nul (terugvoerende draad)","Geel/groen = aarde (veiligheidsdraad)","Sluit de draden aan op de juiste aansluitpunten in de stekker.","Gebruik de schroevendraaier om de draden stevig vast te zetten."],"menuLabel":"Draden aansluiten"},{"label":"Stap 5","title":"Stap 5: Isoleren van de verbindingen","items":["Controleer of alle draden goed vastzitten en dat er geen koper zichtbaar buiten de klem steekt.","Gebruik isolatietape alleen als je docent dat aangeeft. De aansluiting hoort vooral mechanisch goed en netjes te zitten.","Laat je aansluiting controleren voordat je de stekker of tafeldoos dichtmaakt."],"menuLabel":"Verbinding controleren"},{"label":"Stap 6","title":"Stap 6: Stekker in elkaar zetten","items":["Zet het deksel van de stekker weer op zijn plaats.","Schroef de stekker goed dicht."],"menuLabel":"Stekker sluiten"},{"label":"Stap 7","title":"Stap 7: Controleer de verbinding","items":["Kijk of alles stevig vastzit en of de trekontlasting het snoer goed vasthoudt.","Controleer of de kleuren van de draden bij de juiste aansluitpunten zitten.","Laat je werk controleren door je docent voordat er spanning op komt."],"menuLabel":"Aansluiting testen"},{"label":"Stap 8","title":"Stap 8: Maak foto’s van je werk","items":["Maak een foto van de aangesloten draden voordat je de stekker dichtschroeft.","Maak nog een foto nadat de stekker volledig gemonteerd is.","Zorg ervoor dat de foto's duidelijk en goed belicht zijn."]," ail).","Beschrijving van het probleem.","Uitgevoerde werkzaamheden.","Gebruikte onderdelen en prijzen.","Totaalkosten en handtekening.","Voeg duidelijke kolomnamen toe en gebruik randen en opmaak om invulbare velden te markeren.","Zorg voor consistente lettertypen en formaten voor een professionele uitstraling."],"menuLabel":"Servicebon verbeteren"},{"label":"Stap 3","title":"Stap 3: Voeg berekeningen en automatisering toe","items":["Gebruik Excel-formules om berekeningen automatisch te laten uitvoeren, zoals:","Prijs per onderdeel x aantal = totaalprijs.","Automatische som van alle kosten.","Voeg een datumveld toe dat automatisch de huidige datum invult."],"menuLabel":"Berekeningen toevoegen"},{"label":"Stap 4","title":"Stap 4: Test de servicebon","items":["Vul de servicebon in als test en controleer:","Werken de formules correct?","Is de bon goed leesbaar na het invullen?","Staan alle benodigde velden op de juiste plek?","Pas eventuele fouten aan en verbeter de template verder."],"menuLabel":"Servicebon testen"},{"label":"Portfolio","title":"Bewijs in je portfolio","items":["Na de opdracht zet je bewijs in je portfolio. Daarmee laat je zien wat je hebt gedaan, hoe je informatie hebt gezocht en wat je hebt geleerd.","Bronnenbewijs","Voeg je bronnenlogboek toe. Laat zien welke informatie je hebt opgezocht.","Werkbewijs","Voeg foto’s, screenshots, bestanden of ingevulde documentatie toe van je uitgevoerde opdracht.","Reflectie","Beantwoord kort: Wat ging goed? Wat was lastig? Wat doe je volgende keer anders?","Portfolio bijhouden","Bewaar je bronnen, bewijzen en reflectie in je eigen portfolio.","Laat je portfolio aan je docent zien wanneer je feedback wilt, wanneer je twijfelt of wanneer je docent hierom vraagt."],"menuLabel":"Portfolio-bewijs"}]},{"id":"p1-13-installatieprocedure-voor-de-dell-3590-laptop","title":"P1.13 Installatieprocedure voor de Dell 3590 laptop","sections":[{"label":"Start","title":"P1.13 Installatieprocedure voor de Dell 3590 laptop","items":[ stallatie van software op de Dell 3590 (Linux Mint)","sections":[{"label":"Start","title":"P1.14 Installatie van software op de Dell 3590 (Linux Mint)","items":["In deze opdracht installeer je software op de Dell 3590 laptop met Linux Mint. Je controleert of de software werkt en documenteert de installatie.","Wat ga je leren?","Hoe je een overzicht maakt van de benodigde software.","Hoe je software downloadt, installeert en test.","Hoe je software controleert op compatibiliteit en licentievoorwaarden.","Hoe je software documenteert in de systeemdocumentatie.","Hoe je een medestudent laat controleren of de software correct werkt."],"menuLabel":"Start opdracht"},{"label":"Zoek & check","title":"Eerst zelf op onderzoek uit","items":["Voordat je begint, zoek je zelf informatie op die je nodig hebt om deze opdracht goed en veilig uit te voeren. Je mag bijvoorbeeld zoeken via een website, handleiding, YouTube-video, Google of AI.","1. Zoek","Gebruik minimaal twee bronnen. Kies bronnen die passen bij de opdracht.","2. Check","Controleer of de informatie logisch, actueel en betrouwbaar is. Vergelijk bronnen met elkaar.","3. Noteer","Schrijf kort op welke bronnen je hebt gebruikt en wat je eraan had.","Bronnenlogboek","Bron","Wat heb je gezocht?","Wat heb je gebruikt?","Website / video / AI / handleiding","Bijvoorbeeld: aansluitvolgorde, installatie-instelling, veilig werken","Korte uitleg in je eigen woorden","Tip:","Gebruik AI als hulpmiddel, maar neem antwoorden niet zomaar over. Controleer belangrijke informatie altijd met een tweede bron of met je docent."],"menuLabel":"Onderzoek doen"},{"label":"Stap 1","title":"Stap 1: Maak een overzicht van de software","items":["De volgende software moet worden geïnstalleerd:","✔️ Malware- en virusscanner (kwalitatief goed, bijv. ClamAV)","✔️ Software voor PDF-bestanden (bijv. Okular of Master PDF Editor)","✔️ Internetbrowsers: Google Chrome en Opera","✔️ Java Runtime of plug-in, als je docent dit vraagt","✔️ Videospeler, bijvoorbeeld VLC Media Player","✔️ AnyDesk (voor externe toegang)","✔️ GIMP (voor beeldbewerking)","✔️ Microsoft Teams"],"menuLabel":"Softwarelijst maken"},{"label":"Stap 2","title":"Stap 2: Download en verzamel de software","items":["Maak eerst een overzicht van alle software die je nodig hebt.","Controleer per programma of het via Programmabeheer, apt, flatpak of de officiële website beschikbaar is.","Gebruik bij voorkeur de pakketbeheerder van Linux Mint. Dat is overzichtelijker en veiliger dan losse installatiebestanden.","Moet je toch iets downloaden? Gebruik dan alleen de officiële website van de leverancier.","Noteer per programma waar je het vandaan haalt en of er een licentie of account nodig is.","Vraag je docent om controle als je twijfelt tussen een desktopapp, webversie of alternatief programma."],"menuLabel":"Software verzamelen"},{"label":"Stap 3","title":"Stap 3: Controleer compatibiliteit en licenties","items":["Controleer of de software compatibel is met Linux Mint.","Controleer de licenties:","Is de software gratis of commercieel?","Mag de software worden gebruikt voor zakelijke of educatieve doeleinden?"],"menuLabel":"Licenties controleren"},{"label":"Stap 4","title":"Stap 4: Installeer de software","items":["Installeer de software één voor één en controleer na elke installatie of het programma start.","Installeer bij voorkeur via Programmabeheer, apt of flatpak.","Voorbeelden van software die je kunt installeren of controleren:","✔️ Virusscanner of beveiligingssoftware, bijvoorbeeld ClamAV als je docent dat vraagt","✔️ PDF-software, bijvoorbeeld Okular of een vergelijkbaar programma","✔️ Internetbrowser, bijvoorbeeld Chrome, Firefox of Opera","✔️ Java Runtime, alleen als je docent dit vraagt","✔️ Videospeler, bijvoorbeeld VLC","✔️ AnyDesk of een alternatief voor hulp op afstand","✔️ GIMP voor beeldbewerking","✔️ Teams-desktopapp of Teams-webversie, afhankelijk van wat beschikbaar is","Noteer bijzonderheden, foutmeldingen en gekozen alternatieven in je systeemdocumentatie."],"menuLabel":"Software installeren"},{"label":"Stap 5","title":"Stap 5: Test of de software werkt","items":["Open en test de software:","Start elk programma en controleer of het goed functioneert.","Controleer of de gevraagde Java-installatie aanwezig is.","Test de virusscanner met de EICAR-teststring (EICAR.org):","Gebruik alleen het officiële EICAR-testbestand en overleg bij twijfel met je docent.","Controleer of de virusscanner de dreiging detecteert en verwijdert.","Open een PDF-bestand en test de bewerkingsopties.","Controleer of VLC video's afspeelt.","Maak een eenvoudige bewerking in GIMP.","Test of AnyDesk verbinding kan maken met een andere computer.","Start Microsoft Teams en log in."],"menuLabel":"Software testen"},{"label":"Stap 6","title":"Stap 6: Voeg software-informatie toe aan de systeemdocumentatie","items":["Maak een tabel met de geïnstalleerde software en versie-informatie:"],"menuLabel":"Software documenteren"},{"label":"Stap 7","title":"Stap 7: Laat een medestudent de software controleren","items":["Vraag een medestudent om alle software te openen en te testen.","Laat hen noteren of alles correct werkt.","Voeg hun naam en opmerkingen toe aan de systeemdocumentatie."],"menuLabel":"Controle door student"},{"label":"Portfolio","title":"Bewijs in je portfolio","items":["Na de opdracht zet je bewijs in je portfolio. Daarmee laat je zien wat je hebt gedaan, hoe je informatie hebt gezocht en wat je hebt geleerd.","Bronnenbewijs","Voeg je bronnenlogboek toe. Laat zien welke informatie je hebt opgezocht.","Werkbewijs","Voeg foto’s, screenshots, bestanden of ingevulde documentatie toe van je uitgevoerde opdracht.","Reflectie","Beantwoord kort: Wat ging goed? Wat was lastig? Wat doe je volgende keer anders?","Portfolio bijhouden","Bewaar je bronnen, bewijzen en reflectie in je eigen portfolio.","Laat je portfolio aan je docent zien wanneer je feedback wilt, wanneer je twijfelt of wanneer je docent hierom vraagt."],"menuLabel":"Portfolio-bewijs"}]},{"id":"p1-15-configureren-van-de-dell-3590-linux-mint","title":"P1.15 Configureren van de Dell 3590 (Linux Mint)","sections":[{"label":"Start","title":"P1.15 Configureren van de Dell 3590 (Linux Mint)","items":["In deze opdracht configureer je de Dell 3590-laptop met Linux Mint en stel je de juiste instellingen in. Vervolgens laat je een medestudent de configuratie controleren en werk je de systeemdocumentatie bij.","Wat ga je leren?","Hoe je printers en snelkoppelingen instelt.","Hoe je beveiligingsinstellingen aanpast.","Hoe je tekstverwerker-, spreadsheet- en presentatie-instellingen configureert.","Hoe je een standaardbrowser en startpagina’s instelt.","Hoe je systeemdocumentatie bijwerkt."],"menuLabel":"Start opdracht"},{"label":"Zoek & check","title":"Eerst zelf op onderzoek uit","items":["Voordat je begint, zoek je zelf informatie op die je nodig hebt om deze opdracht goed en veilig uit te voeren. Je mag bijvoorbeeld zoeken via een website, handleiding, YouTube-video, Google of AI.","1. Zoek","Gebruik minimaal twee bronnen. Kies bronnen die passen bij de opdracht.","2. Check","Controleer of de informatie logisch, actueel en betrouwbaar is. Vergelijk bronnen met elkaar.","3. Noteer","Schrijf kort op welke bronnen je hebt gebruikt en wat je eraan had.","Bronnenlogboek","Bron","Wat heb je gezocht?","Wat heb je gebruikt?","Website / video / AI / handleiding","Bijvoorbeeld: aansluitvolgorde, installatie-instelling, veilig werken","Korte uitleg in je eigen woorden","Tip:","Gebruik AI als hulpmiddel, maar neem antwoorden niet zomaar over. Controleer belangrijke informatie altijd met een tweede bron of met je docent."],"menuLabel":"Onderzoek doen"},{"label":"Stap 1","title":"Stap 1: Standaardprinter instellen","items":["Open Instellingen > Printers.","Voeg een nieuwe printer toe en selecteer CutePDF Writer als standaardprinter."],"menuLabel":"Printer instellen"},{"label":"Stap 2","title":"Stap 2: Snelkoppelingen op het bureaublad maken","items":["Ga naar het bureaublad en klik met de rechtermuisknop.","Maak de volgende snelkoppelingen aan:","Tekstverwerker (LibreOffice Writer of een ander tekstverwerkingsprogramma).","Spreadsheetpakket (LibreOffice Calc).","start.exactonline.nl:","Klik met de rechtermuisknop > Nieuw > Snelkoppeling.","Vul de URL in en geef de snelkoppeling een naam.","Google Chrome:","Klik op het Chrome-icoon en sleep het naar het bureaublad."],"menuLabel":"Snelkoppelingen maken"},{"label":"Stap 3","title":"Stap 3: Beveiligingsinstellingen toepassen","items":["Beperk toegang tot de laptop met een wachtwoord:","Ga naar Instellingen > Gebruikers en Groepen.","Zorg dat aanmelden altijd met een wachtwoord vereist is.","Extra account maken voor kinderen:","Ga naar Instellingen > Gebruikers en Groepen.","Voeg een nieuw account toe zonder beheerdersrechten.","Beperk de mogelijkheden om software te installeren."],"menuLabel":"Beveiliging instellen"},{"label":"Stap 4","title":"Stap 4: Instellingen voor tekstverwerker, spreadsheet en presentatiesoftware","items":["Tekstverwerker (LibreOffice Writer)","Open LibreOffice Writer en ga naar Extra > Opties > Laden/Opslaan.","Stel in:","Automatisch opslaan elke 10 minuten.","Auteur: vul je eigen naam in.","Standaardlettertype: Segoe UI 11 pts.","Alineamarkeringen en verborgen opmaaksymbolen uitschakelen.","Nederlandse spellingcontrole inschakelen.","Spreadsheet (LibreOffice Calc)","Open LibreOffice Calc en ga naar Extra > Opties > Laden/Opslaan.","Stel in:","Automatisch opslaan elke 10 minuten.","Auteur: vul je eigen naam in.","Standaardlettertype: Segoe UI 10 pts.","Presentatiesoftware (LibreOffice Impress)","Open LibreOffice Impress en ga naar Extra > Opties > Laden/Opslaan.","Stel in:","Automatisch opslaan elke 10 minuten.","Auteur: vul je eigen naam in."],"menuLabel":"Office instellen"},{"label":"Stap 5","title":"Stap 5: Standaardbrowser en startpagina’s instellen","items":["Open Instellingen > Standaardapplicaties > Webbrowser.","Kies Google Chrome als standaardbrowser.","Open Google Chrome en stel de volgende startpagina’s in:","www.theguardian.com","www.aex.nl","www.nasdaq.com","www.google.com"],"menuLabel":"Browser instellen"},{"label":"Stap 6","title":"Stap 6: Laat een medestudent de instellingen controleren","items":["Vraag een medestudent om de instellingen te controleren:","Werkt de standaardprinter correct?","Zijn de snelkoppelingen op het bureaublad aanwezig?","Klopt de beveiliging en het extra account?","Zijn de tekstverwerker-, spreadsheet- en presentatiesoftware correct ingesteld?","Staan de juiste startpagina’s in de browser ingesteld?","Laat je medestudent noteren of alles correct werkt en voeg dit toe aan de systeemdocumentatie."],"menuLabel":"Controle door student"},{"label":"Stap 7","title":"Stap 7: Werk je systeemdocumentatie bij","items":["Open de systeemdocumentatie van de vorige opdrachten (P1.13 en P1.14).","Voeg een nieuw hoofdstuk toe over de configuratie-instellingen, inclusief:","Standaardprinter","Bureaublad-snelkoppelingen","Beveiligingsinstellingen","Extra account","Instellingen voor tekstverwerker, spreadsheet en presentatiesoftware","Browser en startpagina’s","Voeg toe wie de controle heeft uitgevoerd en de testresultaten."],"menuLabel":"Documentatie bijwerken"},{"label":"Portfolio","title":"Bewijs in je portfolio","items":["Na de opdracht zet je bewijs in je portfolio. Daarmee laat je zien wat je hebt gedaan, hoe je informatie hebt gezocht en wat je hebt geleerd.","Bronnenbewijs","Voeg je bronnenlogboek toe. Laat zien welke informatie je hebt opgezocht.","Werkbewijs","Voeg foto’s, screenshots, bestanden of ingevulde documentatie toe van je uitgevoerde opdracht.","Reflectie","Beantwoord kort: Wat ging goed? Wat was lastig? Wat doe je volgende keer anders?","Portfolio bijhouden","Bewaar je bronnen, bewijzen en reflectie in je eigen portfolio.","Laat je portfolio aan je docent zien wanneer je feedback wilt, wanneer je twijfelt of wanneer je docent hierom vraagt."],"menuLabel":"Portfolio-bewijs"}]},{"id":"p1-16-dualboot-installatie-van-windows-11-en-linux-mint-op-een-dell-desktop","title":"P1.16 Dualboot Installatie van Windows 11 en Linux Mint op een Dell Desktop","sections":[{"label":"Start","title":"P1.16 Dualboot Installatie van Windows 11 en Linux Mint op een Dell Desktop","items":["In deze opdracht leer je hoe je een dualboot-installatie uitvoert met Windows 11 en Linux Mint op een Dell Desktop. Je volgt een stapsgewijze procedure om beide besturingssystemen correct te installeren en te configureren.","Wat ga je leren?","Hoe je Windows 11 installeert via PXE-boot.","Hoe je Linux Mint installeert naast Windows 11 (dualboot).","Hoe je de partities correct instelt voor een dualboot-systeem.","Hoe je het GRUB-menu configureert om tussen besturingssystemen te schakelen.","Hoe je drivers en updates installeert voor een optimale werking."],"menuLabel":"Start opdracht"},{"label":"Zoek & check","title":"Eerst zelf op onderzoek uit","items":["Voordat je begint, zoek je zelf informatie op die je nodig hebt om deze opdracht goed en veilig uit te voeren. Je mag bijvoorbeeld zoeken via een website, handleiding, YouTube-video, Google of AI.","1. Zoek","Gebruik minimaal twee bronnen. Kies bronnen die passen bij de opdracht.","2. Check","Controleer of de informatie logisch, actueel en betrouwbaar is. Vergelijk bronnen met elkaar.","3. Noteer","Schrijf kort op welke bronnen je hebt gebruikt en wat je eraan had.","Bronnenlogboek","Bron","Wat heb je gezocht?","Wat heb je gebruikt?","Website / video / AI / handleiding","Bijvoorbeeld: aansluitvolgorde, installatie-instelling, veilig werken","Korte uitleg in je eigen woorden","Tip:","Gebruik AI als hulpmiddel, maar neem antwoorden niet zomaar over. Controleer belangrijke informatie altijd met een tweede bron of met je docent."],"menuLabel":"Onderzoek doen"},{"label":"Stap 1","title":"Stap 1: Installatie van Windows 11 via PXE-boot","items":["Start de Dell Desktop en druk herhaaldelijk op F12 of Esc om het opstartmenu te openen.","Kies PXE-boot:","Selecteer de optie voor netwerkinstallatie (PXE-boot).","Verbinding met de WDS-server:","Wacht tot het Windows Deployment Services (WDS) menu verschijnt.","Selecteer de juiste installatieafbeelding:","Kies de gewenste Windows 11-installatieafbeelding.","Volg de installatie-instructies:","Kies voor een schone installatie wanneer daarom wordt gevraagd.","Selecteer de juiste schijf en wis alle gegevens op de partitie waar Windows wordt geïnstalleerd.","Laat de installatie voltooien:","De computer zal een paar keer opnieuw opstarten.","Configureer Windows 11:","Kies de juiste taal, tijdzone en netwerkverbinding.","Log in met een Microsoft-account of maak een lokaal account aan.","Installeer stuurprogramma’s en updates:","Ga naar Instellingen > Windows Update en installeer alle beschikbare updates.","Download en installeer ontbrekende drivers via de Dell-website of Dell SupportAssist."],"menuLabel":"Windows via PXE installeren"},{"label":"Stap 2","title":"Stap 2: Voorbereiding voor de installatie van Linux Mint","items":["Controleer de systeemvereisten:","Zorg ervoor dat je systeem voldoet aan de eisen voor Windows 11 en Linux Mint.","Maak een opstartbare USB-stick voor Linux Mint:","Download de nieuwste versie van Linux Mint van de officiële website.","Gebruik een tool zoals Rufus (Windows) of Balena Etcher om een opstartbare USB-stick te maken."],"menuLabel":"Linux voorbereiden"},{"label":"Stap 3","title":"Stap 3: Partitie maken voor Linux Mint","items":["Open Schijfbeheer in Windows:","Klik met de rechtermuisknop op de Startknop en kies Schijfbeheer.","Verklein de Windows-partitie:","Zoek de C:-schijf waar Windows 11 op is geïnstalleerd.","Klik met de rechtermuisknop en kies Volume verkleinen.","Voer de grootte in (minimaal 20 GB aanbevolen) voor de Linux-partitie.","Maak ruimte vrij voor Linux Mint:","Je ziet nu een sectie met \"Niet-toegewezen\" ruimte.","Deze ruimte wordt later gebruikt voor de Linux-installatie."],"menuLabel":"Linux-partitie maken"},{"label":"Stap 4","title":"Stap 4: Installatie van Linux Mint","items":["Start de computer op vanaf de USB-stick:","Steek de opstartbare USB-stick in de computer.","Druk op F12, F2, ESC of DEL om het opstartmenu te openen.","Kies de USB-stick als opstartmedium.","Start de installatie van Linux Mint:","Kies \"Start Linux Mint\" om de live-omgeving te openen.","Klik op \"Install Linux Mint\" op het bureaublad.","Selecteer de installatie-opties:","Kies de taal: Nederlands.","Selecteer de installatie-optie \"Something else\" om de partities handmatig in te stellen.","Maak de partities aan voor Linux Mint:","Zoek de \"Niet-toegewezen ruimte\" die je eerder hebt gemaakt.","Maak de volgende partities aan:","Root-partitie (/): Minimaal 20 GB, bestandssysteem ext4.","Swap-partitie: Gelijk aan je RAM-geheugen of 4 GB (optioneel).","(Optioneel) Home-partitie (/home) voor persoonlijke bestanden.","Installeer de bootloader (GRUB):","Zorg ervoor dat GRUB wordt geïnstalleerd op de juiste schijf (meestal /dev/sda).","Voltooi de installatie:","Volg de rest van de instructies om de installatie af te ronden.","Start de computer opnieuw op wanneer daarom wordt gevraagd."],"menuLabel":"Linux Mint installeren"},{"label":"Stap 5","title":"Stap 5: Dualboot configureren en opstarten","items":["GRUB-menu controleren:","Bij het opstarten van de computer zou je nu het GRUB-menu moeten zien.","Hier kun je kiezen tussen Windows 11 en Linux Mint.","Besturingssysteem selecteren:","Kies het besturingssysteem dat je wilt opstarten.","Updates uitvoeren in beide besturingssystemen:","Windows 11: Ga naar Instellingen > Windows Update en installeer alle updates.","Linux Mint: Open Updatebeheer en installeer de nieuwste updates.","Drivers installeren:","Installeer indien nodig extra stuurprogramma’s in Linux Mint via Besturingssysteembeheer > Stuurprogramma’s."],"menuLabel":"Dualboot testen"},{"label":"Stap 6","title":"Stap 6: Controle en documentatie","items":["Controleer of beide besturingssystemen correct opstarten.","Test de functionaliteit van Windows 11 en Linux Mint.","Voeg de installatieprocedure en testresultaten toe aan de systeemdocumentatie:","Beschrijf de volgorde van installatie.","Noteer eventuele problemen en oplossingen.","Vermeld wie de controle heeft uitgevoerd.","Probleemoplossing","GRUB-menu wordt niet weergegeven:","Controleer of de bootloader correct is geïnstalleerd.","Start de computer opnieuw op en wijzig de opstartvolgorde in het BIOS.","Windows 11 start direct op zonder GRUB-menu:","Voer de volgende opdracht uit in Linux Mint: sudo update-grub","Linux Mint detecteert de Windows-partitie niet:","Controleer of de Windows-partitie niet in hibernation mode staat.","Met deze opdracht leer je hoe je een dualboot-systeem installeert en configureert. Zorg ervoor dat beide besturingssystemen correct werken en dat je documentatie volledig is. Veel succes! 🚀"],"menuLabel":"Controle en documentatie"},{"label":"Portfolio","title":"Bewijs in je portfolio","items":["Na de opdracht zet je bewijs in je portfolio. Daarmee laat je zien wat je hebt gedaan, hoe je informatie hebt gezocht en wat je hebt geleerd.","Bronnenbewijs","Voeg je bronnenlogboek toe. Laat zien welke informatie je hebt opgezocht.","Werkbewijs","Voeg foto’s, screenshots, bestanden of ingevulde documentatie toe van je uitgevoerde opdracht.","Reflectie","Beantwoord kort: Wat ging goed? Wat was lastig? Wat doe je volgende keer anders?","Portfolio bijhouden","Bewaar je bronnen, bewijzen en reflectie in je eigen portfolio.","Laat je portfolio aan je docent zien wanneer je feedback wilt, wanneer je twijfelt of wanneer je docent hierom vraagt."],"menuLabel":"Portfolio-bewijs"}]},{"id":"p1-17-software-installatie-dell-desktop-dualboot","title":"P1.17 Installatie van software op de Dell Desktop (met dualboot)","sections":[{"label":"Start","title":"P1.17 Installatie van software op de Dell Desktop (met dualboot)","items":["In deze opdracht installeer je software op de Dell Desktop met dualboot. Je werkt dus met Windows 11 én Linux Mint.","Je installeert ProjectLibre, LibreOffice en GIMP, test of de programma’s werken en legt de installatie netjes vast in de systeemdocumentatie.","Wat ga je leren?","Hoe je software kiest en controleert voor twee besturingssystemen.","Hoe je software installeert op Windows 11 en Linux Mint.","Hoe je licentievoorwaarden kort controleert en beschrijft.","Hoe je versie, bron en installatiemethode noteert.","Hoe je een medestudent laat controleren of alles werkt."],"menuLabel":"Start opdracht"},{"label":"Zoek & check","title":"Eerst zelf op onderzoek uit","items":["Voordat je begint, zoek je zelf informatie op die je nodig hebt om deze software veilig en correct te installeren.","Controleer bij voorkeur de officiële websites van de programma’s en vergelijk belangrijke informatie met een tweede bron of met je docent.","Noteer per programma: downloadbron, versie, besturingssysteem, licentie en installatiemethode."],"menuLabel":"Onderzoek doen"},{"label":"Stap 1","title":"Stap 1: Maak een overzicht van de software","items":["Maak eerst een overzicht van de software die op beide besturingssystemen geïnstalleerd moet worden.","ProjectLibre: software voor projectmanagement.","LibreOffice: officepakket voor tekst, spreadsheets en presentaties.","GIMP: beeldbewerkingssoftware.","Zet erbij of je de software installeert op Windows 11, Linux Mint of op allebei."],"menuLabel":"Software-overzicht"},{"label":"Stap 2","title":"Stap 2: Download en verzamel de software","items":["Zoek per programma de juiste download of installatiemethode.","Voor Windows 11 gebruik je bij voorkeur de officiële downloadpagina’s van ProjectLibre, LibreOffice en GIMP.","Voor Linux Mint controleer je of de software via de pakketbeheerder of via een officiële Linux-installatiemethode beschikbaar is.","LibreOffice is vaak al aanwezig in Linux Mint. Controleer dit eerst voordat je opnieuw installeert.","Noteer waar je de software vandaan haalt en welke versie je gebruikt."],"menuLabel":"Downloads verzamelen"},{"label":"Stap 3","title":"Stap 3: Controleer compatibiliteit en licenties","items":["Controleer of elk programma geschikt is voor het besturingssysteem waarop je het installeert.","Controleer kort de licentievoorwaarden van ProjectLibre, LibreOffice en GIMP.","Noteer in je documentatie dat het om open source software gaat waar dat van toepassing is.","Twijfel je over een licentie of installatiebron? Vraag dan eerst je docent om bevestiging."],"menuLabel":"Licenties controleren"},{"label":"Stap 4","title":"Stap 4: Installeer de software","items":["Installeer de software eerst op Windows 11 en daarna op Linux Mint, of werk in de volgorde die je docent aangeeft.","Windows 11: open het installatiebestand van ProjectLibre, LibreOffice en GIMP en volg de installatie-instructies.","Linux Mint: gebruik de pakketbeheerder of terminal waar dat geschikt is.","Gebruik bijvoorbeeld: sudo apt update","Gebruik voor LibreOffice waar nodig: sudo apt install libreoffice","Gebruik voor GIMP waar nodig: sudo apt install gimp","Voor ProjectLibre op Linux Mint controleer je eerst welke installatiemethode beschikbaar en toegestaan is."],"menuLabel":"Software installeren"},{"label":"Stap 5","title":"Stap 5: Test of de software werkt","items":["Open elk programma op beide besturingssystemen en controleer of het zonder foutmelding start.","Start ProjectLibre en maak een klein testproject.","Open LibreOffice en maak een kort testdocument.","Open GIMP en maak of bewerk een eenvoudige afbeelding.","Maak bewijs van je testresultaten, bijvoorbeeld met screenshots of korte notities."],"menuLabel":"Software testen"},{"label":"Stap 6","title":"Stap 6: Werk de systeemdocumentatie bij","items":["Voeg een hoofdstuk toe over deze software-installatie.","Noteer per programma: naam, versie, besturingssysteem en installatiemethode.","Vermeld ook kort of de software werkt en hoe je dat hebt getest.","Sla je documentatie netjes op met een duidelijke naam voor P1.17."],"menuLabel":"Documentatie bijwerken"},{"label":"Stap 7","title":"Stap 7: Laat een medestudent controleren","items":["Vraag een medestudent om de software op Windows 11 en Linux Mint kort te openen en te testen.","Laat je medestudent noteren of alles correct werkt.","Neem de naam van de medestudent en eventuele opmerkingen op in je documentatie.","Verbeter fouten voordat je de opdracht inlevert."],"menuLabel":"Controle door student"},{"label":"Portfolio","title":"Bewijs in je portfolio","items":["Na de opdracht zet je bewijs in je portfolio. Daarmee laat je zien wat je hebt gedaan, hoe je informatie hebt gezocht en wat je hebt geleerd.","Bronnenbewijs","Voeg je bronnenlogboek toe. Laat zien welke informatie je hebt opgezocht.","Werkbewijs","Voeg screenshots, testresultaten of ingevulde documentatie toe van de software-installatie.","Reflectie","Beantwoord kort: Wat ging goed? Wat was lastig? Wat doe je volgende keer anders?"],"menuLabel":"Portfolio-bewijs"}]},{"id":"p1-18-configureren-van-de-dell-desktop-dualboot-systeem","title":"P1.18 Configureren van de Dell Desktop (Dualboot-systeem)","sections":[{"label":"Start","title":"P1.18 Configureren van de Dell Desktop (Dualboot-systeem)","items":["In deze opdracht richt je de Dell Desktop zo in dat Windows 11 en Linux Mint dezelfde DATA-opslag kunnen gebruiken.","Het doel is dat documenten, spreadsheets, presentaties en afbeeldingen op één herkenbare plek staan, ongeacht met welk besturingssysteem je werkt.","Wat ga je leren?","Hoe je een gedeelde DATA-partitie controleert of aanmaakt.","Hoe je dezelfde mappen zichtbaar maakt in Windows en Linux Mint.","Hoe je LibreOffice zo instelt dat bestanden standaard op DATA worden opgeslagen.","Hoe je controleert of de gedeelde opslag echt werkt.","Hoe je jouw instellingen vastlegt in de systeemdocumentatie."],"menuLabel":"Start opdracht"},{"label":"Zoek & check","title":"Eerst zelf op onderzoek uit","items":["Voordat je begint, zoek je zelf informatie op die je nodig hebt om deze opdracht goed en veilig uit te voeren. Je mag bijvoorbeeld zoeken via een website, handleiding, YouTube-video, Google of AI.","1. Zoek","Gebruik minimaal twee bronnen. Kies bronnen die passen bij de opdracht.","2. Check","Controleer of de informatie logisch, actueel en betrouwbaar is. Vergelijk bronnen met elkaar.","3. Noteer","Schrijf kort op welke bronnen je hebt gebruikt en wat je eraan had.","Bronnenlogboek","Bron","Wat heb je gezocht?","Wat heb je gebruikt?","Website / video / AI / handleiding","Bijvoorbeeld: aansluitvolgorde, installatie-instelling, veilig werken","Korte uitleg in je eigen woorden","Tip:","Gebruik AI als hulpmiddel, maar neem antwoorden niet zomaar over. Controleer belangrijke informatie altijd met een tweede bron of met je docent."],"menuLabel":"Onderzoek doen"},{"label":"Stap 1","title":"Stap 1: DATA-partitie controleren of aanmaken","items":["Start eerst Windows 11 en open Schijfbeheer.","Controleer of er een partitie met de naam DATA bestaat. Als die er nog niet is, maak je een nieuwe NTFS-partitie aan met de naam DATA.","Geef de partitie in Windows een duidelijke schijfletter, bijvoorbeeld D:.","Start daarna Linux Mint en open Schijven of GParted.","Controleer of je dezelfde DATA-partitie ziet. Let goed op: formatteer deze partitie niet opnieuw.","Noteer hoe Linux Mint de DATA-partitie weergeeft. Vraag je docent om controle als je twijfelt welke partitie de juiste is."],"menuLabel":"DATA-partitie controleren"},{"label":"Stap 2","title":"Stap 2: Mappen op de DATA-partitie maken","items":["Maak op de DATA-partitie vier duidelijke mappen:","✔️ teksten","✔️ spreadsheets","✔️ presentaties","✔️ afbeeldingen","Controleer in Windows of de mappen zichtbaar zijn op D:.","Controleer in Linux Mint of dezelfde mappen zichtbaar zijn op de gekoppelde DATA-partitie.","Maak eventueel een klein testbestand om te controleren of je in beide systemen kunt lezen en schrijven."],"menuLabel":"Mappen op DATA maken"},{"label":"Stap 3","title":"Stap 3: LibreOffice-paden instellen","items":["Open LibreOffice in Windows 11 en ga naar Extra > Opties > Paden.","Stel de standaardmappen in op de mappen op DATA:","Documenten → D:\\teksten","Spreadsheets → D:\\spreadsheets","Presentaties → D:\\presentaties","Afbeeldingen → D:\\afbeeldingen","Open daarna LibreOffice in Linux Mint en stel dezelfde soort paden in naar de DATA-partitie.","Gebruik in Linux de locatie waar DATA gekoppeld is. Vraag je docent om controle als je niet zeker weet welk pad je moet kiezen."],"menuLabel":"LibreOffice-paden instellen"},{"label":"Stap 4","title":"Stap 4: Testen of de gedeelde opslag werkt","items":["Maak in Windows een klein testdocument en sla dit op in de map teksten op DATA.","Start Linux Mint en controleer of je hetzelfde document kunt openen.","Maak daarna in Linux Mint een klein testbestand en controleer in Windows of je dit bestand ziet.","Test ook kort of LibreOffice de juiste standaardmappen gebruikt.","Lukt lezen of schrijven niet? Noteer wat er gebeurt en vraag je docent om hulp voordat je instellingen zoals rechten of koppelingen aanpast."],"menuLabel":"Gedeelde opslag testen"},{"label":"Stap 5","title":"Stap 5: Laat een medestudent de instellingen controleren","items":["Vraag een medestudent om de configuratie te controleren.","Laat controleren of de DATA-partitie zichtbaar is in Windows en Linux Mint.","Laat controleren of de vier mappen aanwezig zijn.","Laat controleren of testbestanden in beide besturingssystemen zichtbaar zijn.","Laat controleren of LibreOffice naar de juiste DATA-mappen verwijst.","Noteer de naam van de controleur en wat er is gecontroleerd."],"menuLabel":"Controle door student"},{"label":"Stap 6","title":"Stap 6: Werk je systeemdocumentatie bij","items":["Werk je systeemdocumentatie bij met de instellingen van het dualboot-systeem.","Beschrijf waar de DATA-partitie staat in Windows en hoe je deze in Linux Mint terugvindt.","Noteer welke mappen je hebt gemaakt.","Noteer welke LibreOffice-paden je hebt ingesteld.","Voeg je testresultaten en de controle door je medestudent toe."],"menuLabel":"Documentatie bijwerken"},{"label":"Portfolio","title":"Bewijs in je portfolio","items":["Na de opdracht zet je bewijs in je portfolio. Daarmee laat je zien wat je hebt gedaan, hoe je informatie hebt gezocht en wat je hebt geleerd.","Bronnenbewijs","Voeg je bronnenlogboek toe. Laat zien welke informatie je hebt opgezocht.","Werkbewijs","Voeg foto’s, screenshots, bestanden of ingevulde documentatie toe van je uitgevoerde opdracht.","Reflectie","Beantwoord kort: Wat ging goed? Wat was lastig? Wat doe je volgende keer anders?","Portfolio bijhouden","Bewaar je bronnen, bewijzen en reflectie in je eigen portfolio.","Laat je portfolio aan je docent zien wanneer je feedback wilt, wanneer je twijfelt of wanneer je docent hierom vraagt."],"menuLabel":"Portfolio-bewijs"}]},{"id":"p1-19-installatieprocedure-windows-11-op-een-dell-3590-laptop","title":"P1.19 Installatieprocedure Windows 11 op een Dell 3590 laptop","sections":[{"label":"Start","title":"P1.19 Installatieprocedure Windows 11 op een Dell 3590 laptop","items":["In deze opdracht installeer je Windows 11 op een Dell 3590 laptop met de juiste instellingen. Vervolgens controleer je de installatie, test je het systeem en werk je de systeemdocumentatie bij.","Wat ga je leren?","Hoe je Windows 11 installeert met een aangepaste schijfindeling.","Hoe je instellingen configureert zonder Microsoft-account.","Hoe je een systeemcontrole uitvoert en documenteert.","Hoe je de systeemdocumentatie bijwerkt en inlevert."],"menuLabel":"Start opdracht"},{"label":"Zoek & check","title":"Eerst zelf op onderzoek uit","items":["Voordat je begint, zoek je zelf informatie op die je nodig hebt om deze opdracht goed en veilig uit te voeren. Je mag bijvoorbeeld zoeken via een website, handleiding, YouTube-video, Google of AI.","1. Zoek","Gebruik minimaal twee bronnen. Kies bronnen die passen bij de opdracht.","2. Check","Controleer of de informatie logisch, actueel en betrouwbaar is. Vergelijk bronnen met elkaar.","3. Noteer","Schrijf kort op welke bronnen je hebt gebruikt en wat je eraan had.","Bronnenlogboek","Bron","Wat heb je gezocht?","Wat heb je gebruikt?","Website / video / AI / handleiding","Bijvoorbeeld: aansluitvolgorde, installatie-instelling, veilig werken","Korte uitleg in je eigen woorden","Tip:","Gebruik AI als hulpmiddel, maar neem antwoorden niet zomaar over. Controleer belangrijke informatie altijd met een tweede bron of met je docent."],"menuLabel":"Onderzoek doen"},{"label":"Stap 1","title":"Stap 1: Windows 11 Installatiemedia voorbereiden","items":["Download de nieuwste versie van Windows 11 (indien nodig).","Maak een opstartbare USB-stick met Rufus of Windows Media Creation Tool.","Plaats de USB-stick in de Dell 3590 en start de laptop op.","Open het bootmenu door herhaaldelijk op F12 te drukken bij het opstarten.","Kies de USB-stick als opstartmedium."],"menuLabel":"Installatiemedium maken"},{"label":"Stap 2","title":"Stap 2: Start de installatie van Windows 11","items":["Selecteer de installatie-instellingen:","✔️ Besturingssysteem: Windows 11 desktopversie","✔️ Toetsenbord, regio en valuta: Verenigde Staten (Internationaal)","✔️ Taal: Engels","✔️ Product Key: Geen (Evaluatieversie)","Klik op ‘Volgende’ en vervolgens op ‘Nu installeren’.","Kies ‘Aangepaste installatie’ om een nieuwe schijfindeling te maken."],"menuLabel":"Windows installeren"},{"label":"Stap 3","title":"Stap 3: Schijfindeling instellen","items":["Verwijder bestaande partities (indien nodig).","Maak de volgende partities aan op Schijf 1:","C: 20 GB (voor het besturingssysteem).","D: 20 GB (voor opslag).","Gebruik de resterende ruimte op Schijf 2 als:","E: Rest van de beschikbare ruimte.","Formatteer alle partities in NTFS en klik op Volgende."],"menuLabel":"Schijfindeling maken"},{"label":"Stap 4","title":"Stap 4: Installatiemethode instellen","items":["Kies ‘Express installatie’ zonder Microsoft-account.","Stel de computernaam in op: Testpc-<studentennummer>.","Maak een lokale gebruiker aan:","Gebruikersnaam: <studentennummer>","Wachtwoord: Pa$$w0rd","Volg de overige installatiestappen en wacht tot de installatie is voltooid."],"menuLabel":"Installatiemethode kiezen"},{"label":"Stap 5","title":"Stap 5: Systeemdocumentatie invullen","items":["Open een nieuw document en noteer:","Datum van installatie","Gekozen instellingen (gebruikersnaam, computernaam, taal, etc.)","Schijfindeling (C: 20 GB, D: 20 GB, E: rest)","Eventuele problemen en hoe je die hebt opgelost"],"menuLabel":"Documentatie invullen"},{"label":"Stap 6","title":"Stap 6: Test of het besturingssysteem goed werkt","items":["Herstart de laptop en controleer of Windows correct opstart.","Controleer de instellingen:","Is de taal correct ingesteld op Engels?","Is de gebruikersnaam en het wachtwoord correct ingesteld?","Wordt de computernaam correct weergegeven?","Zijn de schijfpartities correct geformatteerd?"],"menuLabel":"Windows testen"},{"label":"Stap 7","title":"Stap 7: Laat een medestudent de installatie controleren","items":["Vraag een medestudent om de installatie te testen:","Start Windows 11 op en controleer of alles correct werkt.","Controleer of de C, D en E-schijven correct zijn geformatteerd.","Kijk of de gebruikersnaam, computernaam en instellingen correct zijn ingesteld.","Laat je medestudent de resultaten noteren en voeg deze toe aan je documentatie."],"menuLabel":"Controle door student"},{"label":"Portfolio","title":"Bewijs in je portfolio","items":["Na de opdracht zet je bewijs in je portfolio. Daarmee laat je zien wat je hebt gedaan, hoe je informatie hebt gezocht en wat je hebt geleerd.","Bronnenbewijs","Voeg je bronnenlogboek toe. Laat zien welke informatie je hebt opgezocht.","Werkbewijs","Voeg foto’s, screenshots, bestanden of ingevulde documentatie toe van je uitgevoerde opdracht.","Reflectie","Beantwoord kort: Wat ging goed? Wat was lastig? Wat doe je volgende keer anders?","Portfolio bijhouden","Bewaar je bronnen, bewijzen en reflectie in je eigen portfolio.","Laat je portfolio aan je docent zien wanneer je feedback wilt, wanneer je twijfelt of wanneer je docent hierom vraagt."],"menuLabel":"Portfolio-bewijs"}]},{"id":"p1-20-installatie-van-software-op-de-dell-3590-windows-11","title":"P1.20 Installatie van software op de Dell 3590 (Windows 11)","sections":[{"label":"Start","title":"P1.20 Installatie van software op de Dell 3590 (Windows 11)","items":["In deze opdracht installeer je diverse software op een Dell 3590 laptop met Windows 11. Vervolgens controleer je of alles correct werkt en documenteer je de installatie.","Wat ga je leren?","Hoe je een overzicht maakt van de te installeren software.","Hoe je software downloadt, installeert en test.","Hoe je software controleert op compatibiliteit en licenties.","Hoe je de systeemdocumentatie bijwerkt.","Hoe je een medestudent de software laat controleren."],"menuLabel":"Start opdracht"},{"label":"Zoek & check","title":"Eerst zelf op onderzoek uit","items":["Voordat je begint, zoek je zelf informatie op die je nodig hebt om deze opdracht goed en veilig uit te voeren. Je mag bijvoorbeeld zoeken via een website, handleiding, YouTube-video, Google of AI.","1. Zoek","Gebruik minimaal twee bronnen. Kies bronnen die passen bij de opdracht.","2. Check","Controleer of de informatie logisch, actueel en betrouwbaar is. Vergelijk bronnen met elkaar.","3. Noteer","Schrijf kort op welke bronnen je hebt gebruikt en wat je eraan had.","Bronnenlogboek","Bron","Wat heb je gezocht?","Wat heb je gebruikt?","Website / video / AI / handleiding","Bijvoorbeeld: aansluitvolgorde, installatie-instelling, veilig werken","Korte uitleg in je eigen woorden","Tip:","Gebruik AI als hulpmiddel, maar neem antwoorden niet zomaar over. Controleer belangrijke informatie altijd met een tweede bron of met je docent."],"menuLabel":"Onderzoek doen"},{"label":"Stap 1","title":"Stap 1: Maak een overzicht van de software","items":["De volgende software moet worden geïnstalleerd op Windows 11:"],"menuLabel":"Softwarelijst maken"},{"label":"Stap 2","title":"Stap 2: Download en verzamel de software","items":["Verzamel de software via officiële websites of via Microsoft Store als dat beschikbaar is.","Maak een korte lijst met naam, doel en bron van elk programma.","Voorbeelden van software die je kunt installeren of controleren:","✔️ Malware- en virusscanner, bijvoorbeeld Windows-beveiliging, Malwarebytes of een alternatief dat je docent goedkeurt","✔️ PDF-software, bijvoorbeeld Adobe Acrobat Reader of Foxit Reader","✔️ Internetbrowser, bijvoorbeeld Edge, Chrome of Opera","✔️ Java Runtime, alleen als je docent dit vraagt","✔️ Videospeler, bijvoorbeeld VLC of een andere geschikte speler","✔️ AnyDesk of een alternatief voor hulp op afstand","✔️ GIMP voor beeldbewerking","✔️ Microsoft Teams of de webversie van Teams","Let op: download niets van onbekende websites. Vraag je docent om controle als je twijfelt."],"menuLabel":"Software verzamelen"},{"label":"Stap 3","title":"Stap 3: Controleer compatibiliteit en licenties","items":["Compatibiliteit controleren:","Alle software moet werken op Windows 11 (64-bit).","Controleer de systeemeisen op de officiële website van elk programma.","Licenties controleren:","Gratis software: Google Chrome, Opera, GIMP, AnyDesk, Teams, Java JRE.","Freemium software: Adobe Acrobat Reader, Malwarebytes.","Betaalde software (optioneel): Bitdefender, Foxit PDF Editor."],"menuLabel":"Licenties controleren"},{"label":"Stap 4","title":"Stap 4: Installeer de software","items":["Open de gedownloade installatiebestanden.","Doorloop de installatieprocedures en kies de aanbevolen instellingen.","Start elke applicatie om te controleren of de installatie is geslaagd."],"menuLabel":"Software installeren"},{"label":"Stap 5","title":"Stap 5: Test of de software werkt","items":["Open en test elk programma:","Start Google Chrome en laad een website.","Open een PDF-bestand in Adobe Acrobat Reader.","Controleer Java met een eenvoudige versiecontrole of testopdracht.","Speel een testvideo af in de gekozen videospeler.","Test AnyDesk door een verbinding te maken met een andere computer.","Open GIMP en bewerk een afbeelding.","Start Microsoft Teams en log in.","Test de virusscanner met de EICAR-teststring:","Gebruik alleen het officiële EICAR-testbestand van EICAR.org en overleg bij twijfel met je docent.","Controleer of de virusscanner dit als bedreiging detecteert."],"menuLabel":"Software testen"},{"label":"Stap 6","title":"Stap 6: Voeg software-informatie toe aan de systeemdocumentatie","items":["Maak een tabel met de geïnstalleerde software en versie-informatie:"],"menuLabel":"Software documenteren"},{"label":"Stap 7","title":"Stap 7: Laat een medestudent de software controleren","items":["Vraag een medestudent om alle software te openen en te testen.","Laat hen noteren of alles correct werkt.","Voeg hun naam en opmerkingen toe aan de systeemdocumentatie."],"menuLabel":"Controle door student"},{"label":"Portfolio","title":"Bewijs in je portfolio","items":["Na de opdracht zet je bewijs in je portfolio. Daarmee laat je zien wat je hebt gedaan, hoe je informatie hebt gezocht en wat je hebt geleerd.","Bronnenbewijs","Voeg je bronnenlogboek toe. Laat zien welke informatie je hebt opgezocht.","Werkbewijs","Voeg foto’s, screenshots, bestanden of ingevulde documentatie toe van je uitgevoerde opdracht.","Reflectie","Beantwoord kort: Wat ging goed? Wat was lastig? Wat doe je volgende keer anders?","Portfolio bijhouden","Bewaar je bronnen, bewijzen en reflectie in je eigen portfolio.","Laat je portfolio aan je docent zien wanneer je feedback wilt, wanneer je twijfelt of wanneer je docent hierom vraagt."],"menuLabel":"Portfolio-bewijs"}]},{"id":"p1-21-configureren-van-de-dell-3590-laptop-windows-11","title":"P1.21 Configureren van de Dell 3590 laptop (Windows 11)","sections":[{"label":"Start","title":"P1.21 Configureren van de Dell 3590 laptop (Windows 11)","items":["In deze opdracht configureer je de Dell 3590-laptop volgens de opgegeven instellingen. Je stelt de juiste mappenlocaties in, zorgt voor beveiligingsinstellingen en past de softwarevoorkeuren aan. Vervolgens laat je een medestudent de configuratie controleren en werk je de systeemdocumentatie bij.","Wat ga je leren?","Hoe je mappenlocaties instelt voor documenten, afbeeldingen, muziek en video's.","Hoe je standaardinstellingen configureert voor software en beveiliging.","Hoe je bestanden en back-ups beheert.","Hoe je een medestudent de instellingen laat controleren.","Hoe je de systeemdocumentatie bijwerkt."],"menuLabel":"Start opdracht"},{"label":"Zoek & check","title":"Eerst zelf op onderzoek uit","items":["Voordat je begint, zoek je zelf informatie op die je nodig hebt om deze opdracht goed en veilig uit te voeren. Je mag bijvoorbeeld zoeken via een website, handleiding, YouTube-video, Google of AI.","1. Zoek","Gebruik minimaal twee bronnen. Kies bronnen die passen bij de opdracht.","2. Check","Controleer of de informatie logisch, actueel en betrouwbaar is. Vergelijk bronnen met elkaar.","3. Noteer","Schrijf kort op welke bronnen je hebt gebruikt en wat je eraan had.","Bronnenlogboek","Bron","Wat heb je gezocht?","Wat heb je gebruikt?","Website / video / AI / handleiding","Bijvoorbeeld: aansluitvolgorde, installatie-instelling, veilig werken","Korte uitleg in je eigen woorden","Tip:","Gebruik AI als hulpmiddel, maar neem antwoorden niet zomaar over. Controleer belangrijke informatie altijd met een tweede bron of met je docent."],"menuLabel":"Onderzoek doen"},{"label":"Stap 1","title":"Stap 1: Bestandslocaties instellen","items":["Open Verkenner en ga naar de D:-schijf.","Maak de volgende mappen aan (indien ze nog niet bestaan):","D:\\<studentennummer>\\Documents","D:\\<studentennummer>\\Pictures","D:\\<studentennummer>\\Music","D:\\<studentennummer>\\Video","Wijzig de opslaglocatie van de mappen:","Klik met de rechtermuisknop op Documenten en kies Eigenschappen > Locatie > Verplaatsen."," const taskAttachments = {};
let currentTask = 0;
let currentStep = 0;

function escapeHTML(text) {
  return String(text).replace(/[&<>"']/g, function(ch) {
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch];
  });
}

function fillSelect() {
  const select = document.getElementById('taskSelect');
  select.innerHTML =
    '<option value="" selected>Kies hierboven een dagtaak</option>' +
    tasks.map((task, index) => `<option value="${index}">${escapeHTML(task.title)}</option>`).join('');
}

function showIntroduction() {
  currentTask = null;
  currentStep = 0;
  document.getElementById('stepMenu').innerHTML = '';
  document.getElementById('contentPanel').innerHTML = `
    <h2>Kies eerst een dagtaak</h2>
    <p>De dagtaken staan hierboven in het keuzemenu. Kies daar de taak waarmee je wilt beginnen. Daarna verschijnen links de bijbehorende stappen.</p>
    <p class="info"><strong>Hulpbestanden:</strong> gebruik de knop <strong>Hulpbestanden</strong> rechtsboven. Daar vind je bestanden, formats en hulpmiddelen die je bij de dagtaken nodig kunt hebben.</p>
    <p>Bekijk de hulpbestanden voordat je start en controleer bij elke dagtaak of er een bestand of format voor je klaarstaat.</p>
  `;
}

function menuLabel(section) {
  if (section.menuLabel) return String(section.menuLabel);
  const title = String(section.title || section.label || '').trim();
  const plain = title.replace(/^Stap\s*\d+:\s*/i, '').trim();

  if (/^P\d+\.\d+/i.test(title)) return 'Start van de opdracht';
  if (/onderzoek/i.test(title)) return 'Onderzoek doen';
  if (/portfolio|bewijs in je portfolio/i.test(title)) return 'Portfolio-bewijs';

  const rules = [
    // Specifieke installatiestappen, zodat menu-items niet dubbel worden.
    [/installatie van windows\s*11 via pxe|windows.*pxe/i, 'Windows via PXE'],
    [/windows\s*11 installatiemedia|installatiemedia voorbereiden/i, 'Installatiemedia maken'],
    [/start de installatie van windows|installatie van windows\s*11/i, 'Windows installeren'],
    [/voorbereiding.*linux mint/i, 'Linux voorbereiden'],
    [/partitie.*linux mint/i, 'Linux-partitie maken'],
    [/installatie van linux mint|installeren van linux mint/i, 'Linux Mint installeren'],
    [/dualboot configureren|dualboot.*opstart/i, 'Dualboot opstarten'],
    [/controle en documentatie/i, 'Controle & documentatie'],

    // Controle, documentatie en testen.
    [/laat.*medestudent.*software.*controleren/i, 'Software laten testen'],
    [/laat.*medestudent.*installatie.*controleren/i, 'Installatie laten testen'],
    [/laat.*medestudent.*werk.*controleren/i, 'Werk laten controleren'],
    [/medestudent/i, 'Controle door student'],
    [/test of de software werkt|software werkt/i, 'Software testen'],
    [/test.*besturingssysteem/i, 'OS testen'],
    [/test.*installatie/i, 'Installatie testen'],
    [/controleer compatibiliteit|compatibiliteit.*licentie|licentie/i, 'Licenties checken'],
    [/systeemdocumentatie invullen|vul de systeemdocumentatie in/i, 'Documentatie invullen'],
    [/voeg.*software.*systeemdocumentatie|software-informatie.*systeemdocumentatie/i, 'Software documenteren'],
    [/werk.*systeemdocumentatie.*bij|systeemdocumentatie.*bijwerken/i, 'Documentatie bijwerken'],

    // Servicebon.
    [/open en analyseer.*servicebon/i, 'Servicebon bekijken'],
    [/verbeter.*servicebon/i, 'Servicebon verbeteren'],
    [/berekeningen|automatisering/i, 'Berekeningen toevoegen'],
    [/test.*servicebon/i, 'Servicebon testen'],
    [/servicebon/i, 'Servicebon maken'],

    // Praktijk en hardware.
    [/verzamel.*materiaal|materialen/i, 'Materialen pakken'],
    [/snoer.*voorbereid|bereid.*snoer|snoer voorbereiden/i, 'Snoer voorbereiden'],
    [/kijk goed naar de stekker|bestudeer.*stekker/i, 'Stekker bekijken'],
    [/kijk goed naar de tafeldoos|open de tafeldoos/i, 'Tafeldoos bekijken'],
    [/draden aansluiten|aansluiten/i, 'Draden aansluiten'],
    [/isoleren/i, 'Verbinding isoleren'],
    [/stekker in elkaar|tafeldoos in elkaar|dichtschroef|dicht/i, 'Dichtmaken'],
    [/foto/i, 'Foto’s maken'],
    [/esd/i, 'ESD veilig werken'],
    [/werkplek/i, 'Werkplek veilig maken'],
    [/demonteren/i, 'Computer demonteren'],
    [/assembleren|montage/i, 'Computer monteren'],

    // Advies en voorbereiding.
    [/advies|klantvraag/i, 'Advies voorbereiden'],
    [/budget/i, 'Budget controleren'],
    [/onderdelen|componenten/i, 'Onderdelen kiezen'],
    [/vergelijk/i, 'Opties vergelijken'],
    [/excel|overzicht/i, 'Overzicht maken'],
    [/voorbereiding/i, 'Voorbereiding'],
    [/installatieprocedure|procedure/i, 'Procedure maken'],
    [/schijfindeling/i, 'Schijfindeling maken'],
    [/installatiemethode/i, 'Installatiemethode kiezen'],
    [/juiste instellingen|instellingen invoeren/i, 'Instellingen invoeren'],

    // Software en configuratie.
    [/software.*download|download.*software|download/i, 'Software downloaden'],
    [/software.*installeer|installeer de software|installeren/i, 'Software installeren'],
    [/besturingssysteem|os installeren/i, 'OS installeren'],
    [/bestandslocaties|mappenlocaties/i, 'Mappen instellen'],
    [/standaardprinter|printer/i, 'Printer instellen'],
    [/schermbeveiliging/i, 'Schermbeveiliging'],
    [/snelkoppeling/i, 'Snelkoppelingen maken'],
    [/beveiligingsinstellingen|beveiliging/i, 'Beveiliging instellen'],
    [/virusscanner|back-up|backup/i, 'Virus en back-up'],
    [/tekstverwerker|spreadsheet|presentatie/i, 'Office instellen'],
    [/internetbrowser|browser|startpagina/i, 'Browser instellen'],
    [/controleer|controleren|controle|test/i, 'Werk controleren'],
    [/documentatie/i, 'Documentatie bijwerken']
  ];

  for (const [pattern, shortLabel] of rules) {
    if (pattern.test(plain)) return shortLabel;
  }

  return plain
    .replace(/^Het\s+|^De\s+|^Een\s+/i, '')
    .replace(/\s+bij deze opdracht$/i, '')
    .trim()
    .slice(0, 38);
}

function makeMenuLabels(task) {
  const baseLabels = task.sections.map(section => menuLabel(section));
  const counts = baseLabels.reduce((acc, label) => {
    acc[label] = (acc[label] || 0) + 1;
    return acc;
  }, {});

  return baseLabels.map((label, index) => {
    if (counts[label] === 1) return label;
    const section = task.sections[index];
    const title = String(section.title || section.label || '').trim();
    const match = title.match(/^Stap\s*(\d+)/i);
    return match ? `${label} ${match[1]}` : label;
  });
}

function loadTask(index) {
  if (index === '' || index === null || typeof index === 'undefined') {
    showIntroduction();
    return;
  }
  currentTask = Number(index);
  currentStep = 0;
  const menu = document.getElementById('stepMenu');
  const task = tasks[currentTask];
  const labels = makeMenuLabels(task);
  menu.innerHTML = task.sections.map((section, index) =>
    `<button class="tab-button ${index === 0 ? 'active' : ''}" onclick="loadStep(${index})">${escapeHTML(labels[index])}</button>`
  ).join('');
  loadStep(0);
}

function fileBaseName(path) {
  return String(path || '').split('/').pop().replace(/-1(?=\.[a-z0-9]+$)/i, '');
}

function findAttachment(line) {
  const task = tasks[currentTask];
  const list = taskAttachments[task.id] || [];
  const raw = String(line || '').trim();
  const simple = raw.toLowerCase();
  return list.find(att => {
    const label = String(att.label || '').trim().toLowerCase();
    const base = fileBaseName(att.href).toLowerCase();
    const realBase = String(att.href || '').split('/').pop().toLowerCase();
    return simple === label || simple === base || simple === realBase;
  });
}

function lineToHTML(line) {
  const attachment = findAttachment(line);
  if (attachment) {
    const label = escapeHTML(attachment.label || fileBaseName(attachment.href));
    const href = encodeURI(attachment.href);
    return `<p><a class="resource-link" href="${href}" target="_blank" rel="noopener">Download ${label}</a></p>`;
  }
  const safe = escapeHTML(line);
  if (safe.startsWith('✔️')) return `<li>${safe.replace('✔️ ', '')}</li>`;
  if (/^\d+\.\s/.test(safe)) return `<p class="info"><strong>${safe}</strong></p>`;
  if (safe === 'Tip:') return `<p class="note"><strong>Tip:</strong></p>`;
  if (safe === 'Bronnenlogboek') return `<p class="note"><strong>${safe}</strong></p>`;
  return `<p>${safe}</p>`;
}


function renderResearchSection(section) {
  return `
    <h2>${escapeHTML(section.title)}</h2>
    <p class="research-intro">Zoek eerst kort uit wat je nodig hebt om deze opdracht veilig en goed uit te voeren. Gebruik je bronnen praktisch: alleen wat je echt nodig hebt voor deze dagtaak.</p>
    <div class="research-grid">
      <div class="research-card"><strong>1. Zoek</strong><span>Gebruik minimaal twee bronnen, bijvoorbeeld een handleiding, website, video of AI.</span></div>
      <div class="research-card"><strong>2. Check</strong><span>Vergelijk de informatie. Klopt het met de opdracht, veiligheid en uitleg van je docent?</span></div>
      <div class="research-card"><strong>3. Noteer</strong><span>Schrijf kort op wat je gebruikt hebt en waarom dat helpt bij je uitvoering.</span></div>
    </div>
    <div class="research-log">
      <strong>Bronnenlogboek</strong><span>Vul dit kort in je portfolio of documentatie in.</span>
      <strong>Bron</strong><span>Website, video, AI, handleiding of docent.</span>
      <strong>Gezocht</strong><span>Bijvoorbeeld: veiligheid, aansluitvolgorde, installatie-instelling of controle.</span>
      <strong>Gebruikt</strong><span>Korte uitleg in je eigen woorden.</span>
    </div>
    <p class="research-tip"><strong>Tip:</strong> AI mag je gebruiken als hulpmiddel, maar controleer belangrijke informatie altijd met een tweede bron of met je docent.</p>
  `;
}

function loadStep(index) {
  currentStep = Number(index);
  document.querySelectorAll('.tab-button').forEach((button, i) => button.classList.toggle('active', i === currentStep));
  const task = tasks[currentTask];
  const section = task.sections[currentStep];
  if (/onderzoek/i.test(section.title || section.label || '')) {
    document.getElementById('contentPanel').innerHTML = renderResearchSection(section);
    return;
  }
  const items = section.items || [];
  let html = `<h2>${escapeHTML(section.title)}</h2>`;
  let listBuffer = [];
  function flushList() {
    if (listBuffer.length) {
      html += `<ul>${listBuffer.join('')}</ul>`;
      listBuffer = [];
    }
  }
  items.forEach(line => {
    if (String(line).startsWith('✔️')) {
      listBuffer.push(lineToHTML(line));
    } else {
      flushList();
      html += lineToHTML(line);
    }
  });
  flushList();
  document.getElementById('contentPanel').innerHTML = html;
}

fillSelect();
showIntroduction();
</script>
