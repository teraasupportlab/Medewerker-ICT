div><div class="visual"></div></div></article></div><footer><span><span id="count"></span> · <a href="https://www.acronis.com/en/support/documentation/ATI2026/60003.html" target="_blank" rel="noopener">Bron: Acronis</a></span></footer></main><dialog aria-label="Vergrote Acronis-afbeelding"><button>Sluiten ×</button><img alt=""></dialog><script>const steps=[["Voorbereiden", "Maak je werkplek klaar", "Een image is een reservekopie van Windows, programma’s en instellingen. Je zet de computer terug naar de situatie van die kopie.", "<ul><li>Pak de Acronis-opstartstick van je docent.</li><li>Sluit de netwerkkabel aan: het image staat op de WDS-server.</li><li>Sluit de oplader aan en bewaar je eigen bestanden.</li></ul>", "De doelschijf wordt overschreven. Controleer dat je op de juiste lescomputer werkt.", -1, "USB → Acronis → interne SSD"], ["Opstarten", "Start vanaf de USB-stick", "Sluit de Acronis-opstartstick en de netwerkkabel aan.", "<ol><li>Herstart de computer en open het opstartmenu (bijvoorbeeld F12, F11 of Esc; dit verschilt per merk).</li><li>Kies de Acronis-USB-stick.</li><li>Start Acronis True Image als er een keuzemenu verschijnt.</li></ol>", "Gebruik de opstartmodus die bij het image hoort: UEFI of BIOS. Verander bij twijfel geen BIOS-instellingen; vraag je docent.", -1, "Opstartmenu → USB-stick"], ["Herstel openen", "Kies Recover → My Disks", "Je gaat een bestaande reservekopie terugzetten.", "<ol><li>Zoek het onderdeel <b>Recover</b>.</li><li>Klik op <b>My Disks</b>.</li></ol>", "De namen en schermen kunnen per versie afwijken. Kies de functie voor herstel van schijven.", 0, ""], ["Image kiezen", "Zoek het image op de WDS-server", "Het image staat op de WDS-server. Zorg dat de netwerkkabel is aangesloten.", "<ol><li>Klik op <b>Browse</b> (Bladeren).</li><li>Typ in het locatie- of bestandsnaamveld: <b><code>\\\\data-wds\\</code></b> en druk op <b>Enter</b>.</li><li>Open <b>foute images</b> en daarna <b>win11</b>.</li><li>Kies het image voor jouw opdracht en klik op <b>Next</b>.</li></ol>", "Verschijnt een aanmeldvenster? Gebruik de gegevens van je docent. Server niet bereikbaar? Controleer de netwerkkabel en vraag hulp.", -1, "\\\\data-wds\\ → foute images → win11"], ["Herstelmethode", "Herstel schijven en partities", "Kies de methode voor het terugzetten van de volledige werkplek.", "<ol><li>Selecteer <b>Recover whole disks and partitions</b>.</li><li>Klik op <b>Next</b>.</li></ol>", "Kies hier herstel van schijven en partities; je wilt ook Windows terugzetten.", 1, ""], ["Partities kiezen", "Neem de systeempartities mee", "Een partitie is een apart gedeelte van een schijf. Windows heeft meerdere partities nodig.", "<ol><li>Selecteer de volledige systeemschijf uit het image volgens de opdracht.</li><li>Neem de bijbehorende systeempartities mee, zoals EFI of System Reserved, als die aanwezig zijn.</li><li>Klik op <b>Next</b>.</li></ol>", "De afbeelding toont een voorbeeld. Schijfnamen, letters en partities kunnen op jouw computer verschillen.", 2, ""], ["Doelschijf", "Controleer waar je herstelt", "De doelschijf is de interne SSD of harde schijf van de lescomputer.", "<ol><li>Kies de interne schijf als bestemming.</li><li>Controleer het <b>model en de capaciteit</b>; vertrouw niet alleen op een schijfletter.</li><li>Controleer de bestemming van alle geselecteerde partities.</li></ol>", "STOP bij twijfel. Kies nooit de Acronis-stick of de schijf met het image als bestemming. Laat je docent meekijken.", -1, "✓ Interne SSD     × USB / imageopslag"], ["Start herstel", "Controleer → Proceed", "Lees het overzicht voordat je het herstel start.", "<ol><li>Kloppen het image, de partities en de doelschijf?</li><li>Klik alleen als alles klopt op <b>Proceed</b>.</li><li>Wacht op de melding dat het herstel is geslaagd.</li></ol>", "Zet de computer niet uit en verwijder geen opslag tijdens het herstel.", 3, ""], ["Controle & bewijs", "Start Windows en controleer", "Na de succesmelding sluit je Acronis af en schakel je de computer uit.", "<ol><li>Verwijder de Acronis-stick en start opnieuw vanaf de interne schijf.</li><li>Controleer of Windows start en je kunt inloggen.</li><li>Controleer programma’s en netwerk volgens de opdracht.</li></ol>", "Bewijs: maak een screenshot van de werkende omgeving. Noteer de imagenaam en je controles. Bij een storingsimage kunnen fouten bewust aanwezig zijn.", -1, "Herstel klaar → Windows → controle"]],images=["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAA0QAAAI6CAMAAAAwmHgZAAAB2lBMVEUubKhckcRuotX8/f250ent8/n4+vz////+/v79/v71+fxajsIVMlD6+/290+lhlckAAQHx9vpjl8vp8fheksZnm87J2end6fTz9/s0erOduNNfk8dtoNRpndDU4/OwyeMxZ5wydbDi6/VglMhkmMxxpNdonM/l7vc6cKWsxd9ypdhwo9hsn9Jmmc22zufa5/SFpcazzOaattIwcKxrntKhu9ekvtlFeq+owdx0krRriapPhLhee5vF2u4gQnWnvt1+nsDI2+9Vc5O3z+koXpPR4PElRYBBd6xMaYl5mryYtNApSYxLgLXK3fCMq83C1+1qntGVtNaQsNKZuds6W7uuvOMwbqk2Vq4vT5sfPWsbOWLN3/GeudVDYYAtaqU2gLg1fLVlgqMYNllwo9ZTiLxpnM86V3UnKCnZ4u7l5+oDRJ7X19fe39+orLLMz9EUKLTv7+4SFBU0b6tTVFUqZaQ7isBcX2Y/lci1uLv29vYpYZw9PkCJi43DxMV1d3W5xM9UmOebnZ84wCRecIZqru4lV5cvRl4VLEKZzPWBvvOx1vk1fNnq7vINHS80vvEUXKZDn9JDFCK7VzXw0L+F0H+26rDmpZh8msvnzlrRfm1lUSHelYhIj7Y7s8WRp+JbAAAgAElEQVR42uyd72/aSBrH0SVgml5QOLR2L7qDLm8iVicoqZJNkE9tqZDclZq73XuZ5FreICMwzq11c6DdkKSOIkJRrmx0lbbZP/ae8XhsDxhwCG0TOh/bM8/M88wPw3wzJlRpqP4dh8O5Absh/hpwODeDi4jDuRHr34XWORzOjQitcjjzz07ZHEF5Z7JbM/ojMDRwcxFxvgD2zCNpBEcm+Me79/onlyM46WMR7Q0h7AVhOEoAAnckCEPhwQcN3s4dBOdwXXtIzlxgSrERSOZkd//y/Qgu++AObQwiwBEAQR8oCxu6rgvCmBC2OUbwGd0veKDHcR2PmBO2rCtgU858YamkEYuJJIGUJpJJ3VBoI2RYJ2rHSI3lpiJqY4edUhGB20dEAReaPqSKwfU9XkT+mvFt41ReV0TunOi1wUX05YrIkpGdOLZquu4YWo4swxmJRJAdoNoiunoPpxGN3jPaKBqNIlwBVUREmwMImzpcxBQEq4JkVmqV7OpNatJmtiHY+SbIUWC6on1hS6cZ078geAezDXcYt9XAjNwm7pSYOdmQyfnEcuYbMzf6ec12g2YW0bINFpHr7l9eWSC0sLAM14LRJhUgInAPi0h3FukmPP3glQY5LZCSVU3qdHZ5A0SDlhZpI7a1Vwc0yo3QPQVnCjrTimRMn85QTlPvnPBc8VSty9PSE8v5UkWkUhEtQsFYXoZnNYQzr5uKCFQUibRgm0JXjIiesAhPdCullv4Elp6n2ipBap9WxBNS4/ah04s2YltbMRZPaJQnwltwpsC0EoShGdmJZ/reOdlzFbwxA7GcuWbLFMk3oyb+xGMdpv1dqWiCn7pRtYrczHH3r36x+QCuKvp
