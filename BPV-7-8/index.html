<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BPV</title>
  <link rel="stylesheet" href="style.css">

<style id="project-begroeting-style">
  main { position: relative; }
  .project-begroeting {
    position: absolute;
    right: 8px;
    bottom: 8px;
    width: min(250px, 28%, 42vh);
    height: auto;
    aspect-ratio: 1;
    object-fit: contain;
    pointer-events: none;
    user-select: none;
    z-index: 20;
    background: transparent;
    border: 0;
    border-radius: 0;
  }
</style>
</head>
<body class="landing-page">
  <main class="landing-shell" aria-label="Startpagina BPV">
    <a class="landing-link" href="menu.html" aria-label="Open het BPV-menu">
      <img class="landing-photo" src="BPV 7-8.jpg" alt="BPV">
      <span class="landing-shade" aria-hidden="true"></span>
      <span class="landing-copy">
        <strong>BPV</strong>
        <span>Klik op de foto om te beginnen <b aria-hidden="true">→</b></span>
      </span>
    </a>
  </main>

<script id="project-begroeting-script">
(() => {
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const source = "../../afbeeldingen/AAdjes/08-bpv-begroeting.gif";
  fetch(source).then(response => {
    if (!response.ok) throw new Error('Begroeting niet beschikbaar');
    return response.blob();
  }).then(blob => {
    const url = URL.createObjectURL(blob);
    const robot = new Image(250, 250);
    robot.className = 'project-begroeting';
    robot.alt = '';
    robot.setAttribute('aria-hidden', 'true');
    robot.onload = () => {
      document.querySelector('main').append(robot);
      window.setTimeout(() => {
        robot.remove();
        URL.revokeObjectURL(url);
      }, 3740);
    };
    robot.onerror = () => URL.revokeObjectURL(url);
    robot.src = url;
  }).catch(() => {});
})();
</script>
</body>
</html>
